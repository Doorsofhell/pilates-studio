name: Demonstration preview
on:
  push:
    branches: [main, feature/v1.1-quality-foundation]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund
      - run: npm run verify
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          STANDARD_CHROMIUM: 'true'
      - run: GITHUB_PAGES=true npm run build
      - run: |
          printf '%s\n' "$GITHUB_SHA" > dist/commit.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > artifact-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: preview-evidence-${{ github.sha }}
          path: |
            artifact-sha256.txt
            playwright-report/
            test-results/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
